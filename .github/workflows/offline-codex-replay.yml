name: Offline Codex replay

on:
  push:
    branches: [codex/offline-replay-ci]
    paths:
      - examples/codex/**
      - mcp_alchemy/**
      - src/pdf_tools/**
      - .github/workflows/offline-codex-replay.yml

permissions:
  contents: read

jobs:
  replay:
    if: github.repository_owner == 'Czj027'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install offline replay dependencies
        run: python -m pip install -r examples/codex/requirements.txt
      - name: Replay saved MCP observation without Codex
        run: python -m pytest -c examples/codex/pytest.ini examples/codex --codex-bin=pytest-codex-intentionally-unavailable -q
